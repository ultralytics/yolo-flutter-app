# Ultralytics 🚀 AGPL-3.0 License - https://ultralytics.com/license

name: ultralytics_yolo
description: Flutter plugin for Ultralytics YOLO computer vision models.
version: 0.8.0
homepage: https://github.com/ultralytics/yolo-flutter-app
repository: https://github.com/ultralytics/yolo-flutter-app
issue_tracker: https://github.com/ultralytics/yolo-flutter-app/issues

topics:
  - computer-vision
  - object-detection
  - yolo
  - machine-learning
  - flutter-plugin

funding:
  - https://github.com/sponsors/ultralytics

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  cupertino_ui: ^1.1.7
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  path_provider: ^2.1.5
  plugin_platform_interface: ^2.1.8
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.2
  wakelock_plus: ^1.2.0

dev_dependencies:
  coverage: ^1.15.0
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  mockito: ^5.6.4
  very_good_analysis: ">=6.0.0 <12.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.ultralytics.yolo
        pluginClass: YOLOPlugin
      ios:
        pluginClass: YOLOPlugin
  assets:
    - assets/ultralytics_yolo_logotype.png
    - assets/focus_reticle.png
